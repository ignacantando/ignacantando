name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Count contributions this year
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          year=$(date -u +%Y)
          total=$(gh api graphql -f query='query($login:String!,$from:DateTime!){ user(login:$login){ contributionsCollection(from:$from) { contributionCalendar { totalContributions } } } }' \
            -f login="${{ github.repository_owner }}" -f from="${year}-01-01T00:00:00Z" --jq '.data.user.contributionsCollection.contributionCalendar.totalContributions')
          echo "{\"schemaVersion\":1,\"label\":\"contribuciones en ${year}\",\"message\":\"$total\",\"color\":\"1f6f4a\",\"labelColor\":\"0d1117\"}" | sudo tee dist/contributions.json

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
