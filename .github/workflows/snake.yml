name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Count contributions in the last year
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          total=$(gh api graphql -f query='query($login:String!){ user(login:$login){ contributionsCollection { contributionCalendar { totalContributions } } } }' \
            -f login="${{ github.repository_owner }}" --jq '.data.user.contributionsCollection.contributionCalendar.totalContributions')
          echo "{\"schemaVersion\":1,\"label\":\"contribuciones en el último año\",\"message\":\"$total\",\"color\":\"1f6f4a\",\"labelColor\":\"0d1117\"}" > dist/contributions.json

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
